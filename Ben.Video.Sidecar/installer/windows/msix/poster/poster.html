<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>IsHaunted.com SideCar - poster art</title>
<!--
  The Store poster art, rendered by make-poster.ps1 through headless Chrome at an exact pixel
  size. There is no image editor on this machine and no need for one: the composition is CSS, so
  it is diffable, re-renderable at any size, and uses the SITE'S OWN font files and wordmark
  rather than an approximation of them.

  Everything is sized in vmin, so one file renders both the 2:3 poster (1440x2160) and the square
  (1080x1080) with the proportions held. vmin is the SHORT side, which is the width in both cases.

  The wordmark is copied from the site, not re-invented: Components/Layout/BenHeader.razor has
  <strong>Is</strong><em>Haunted</em><span class="opacity-75">.com</span>, and wwwroot/app.css
  sets Irish Grover with strong at .6 opacity and em back to normal style. If the site's brand
  changes, change it there and re-render here.
-->
<link rel="stylesheet" href="fonts.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 100%; height: 100%; overflow: hidden; }

  body {
    /* The site's own theme colour, so the art sits on the same ground the app does. */
    background: #212529;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ---- background: the editor, blurred ------------------------------------
     Scaled up 1.25x before blurring. A blur samples beyond the element's edge and finds nothing
     there, so an unscaled backdrop fades to transparent in a band around all four sides - the
     scale pushes that band off-canvas. */
  .shot {
    position: absolute;
    inset: 0;
    background-image: url('editor-shot.png');
    background-size: cover;
    background-position: 86% 50%;
    transform: scale(1.25);
    filter: blur(1.7vmin) saturate(1.15) brightness(1.65);
  }

  /* Darkened enough that white type sits on it comfortably, with the centre kept slightly
     lighter so the ghost has something to stand against rather than floating on flat black. */
  .veil {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(62% 48% at 50% 40%, rgba(20,28,22,0.06) 0%, rgba(14,18,20,0.34) 52%, rgba(8,10,11,0.76) 100%),
      linear-gradient(180deg, rgba(10,12,14,0.46) 0%, rgba(10,12,14,0.10) 36%, rgba(7,9,10,0.82) 100%);
  }

  .stack {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 6vmin;
  }

  /* ---- the ghost ---- */
  .mark {
    width: 42vmin;
    height: 42vmin;
    /* Two drop-shadows rather than one: a tight dark one to lift the white ghost off the
       backdrop at any size, and a wide green one that reads as the glow the logo's own ring
       suggests. box-shadow would draw a rectangle; drop-shadow follows the alpha. */
    filter:
      drop-shadow(0 0.5vmin 1.6vmin rgba(0,0,0,0.75))
      drop-shadow(0 0 5vmin rgba(114,167,63,0.38));
  }

  /* ---- the wordmark, exactly as the site sets it ---- */
  .is-haunted-text {
    font-family: 'Irish Grover', system-ui, sans-serif;
    font-weight: 400;
    font-size: 9.2vmin;
    line-height: 1;
    white-space: nowrap;
    color: #F8F9F9;
    margin-top: 3.4vmin;
    text-shadow: 0 0.35vmin 1.4vmin rgba(0,0,0,0.8);
  }
  .is-haunted-text strong { font-weight: 400; opacity: .6; }
  .is-haunted-text em     { font-style: normal; }
  .is-haunted-text .dotcom { opacity: .75; }

  /* ---- the product name ---- */
  .product {
    font-family: 'Public Sans', system-ui, sans-serif;
    font-weight: 300;
    font-size: 4.3vmin;
    letter-spacing: 0.42em;
    /* letter-spacing adds a trailing gap after the last letter, which throws a centred line off
       to the left by half of it. Pull it back. */
    text-indent: 0.42em;
    text-transform: uppercase;
    color: #C3EF52;
    margin-top: 2.6vmin;
    text-shadow: 0 0.2vmin 1.2vmin rgba(0,0,0,0.85);
  }

  .rule {
    width: 17vmin;
    height: 0.28vmin;
    margin-top: 3.6vmin;
    background: linear-gradient(90deg, rgba(195,239,82,0) 0%, rgba(195,239,82,0.85) 50%, rgba(195,239,82,0) 100%);
  }

  .tagline {
    font-family: 'Public Sans', system-ui, sans-serif;
    font-weight: 400;
    font-size: 2.45vmin;
    line-height: 1.5;
    color: rgba(248,249,249,0.82);
    margin-top: 3.4vmin;
    max-width: 74vmin;
    text-shadow: 0 0.2vmin 1vmin rgba(0,0,0,0.9);
  }

  /* ---- square (1080x1080) ----------------------------------------------
     Same scale, less air. The portrait has height to spend and the square does not.
     Bounded at the top as well as the bottom so 16:9 falls through to the block below rather
     than inheriting a layout tuned for a frame with no width to spare. */
  @media (min-aspect-ratio: 1/1) and (max-aspect-ratio: 5/4) {
    .mark       { width: 38vmin; height: 38vmin; }
    .is-haunted-text { font-size: 8.6vmin; margin-top: 2.6vmin; }
    .product    { font-size: 4vmin; margin-top: 2vmin; }
    .rule       { margin-top: 2.8vmin; }
    .tagline    { margin-top: 2.6vmin; font-size: 2.5vmin; max-width: 66vmin; }
    .shot       { background-position: 100% 50%; }
  }

  /* ---- landscape (1920x1080 and 3840x2160) -----------------------------
     One layout for both: 3840x2160 is exactly twice 1920x1080, and everything here is in vmin,
     so the two renders are the same picture at two resolutions rather than two designs.

     Kept CENTRED rather than laid out as logo-left / text-right, which would fill the frame more
     handsomely. The Store crops hero art differently in different placements and can lay its own
     title over one side of it; a centred lockup survives that, and an off-centre one is a gamble
     on a layout we do not control. It also keeps this recognisably the same piece as the poster
     and the square.

     Everything is a touch larger than the square's scale because a 16:9 frame read at a distance
     is mostly air, and a lockup sized for a tile disappears into it. */
  @media (min-aspect-ratio: 5/4) {
    .mark       { width: 40vmin; height: 40vmin; }
    .is-haunted-text { font-size: 9.6vmin; margin-top: 2.8vmin; }
    .product    { font-size: 4.4vmin; margin-top: 2.2vmin; }
    .rule       { width: 18vmin; margin-top: 3vmin; }
    .tagline    { margin-top: 3vmin; font-size: 2.6vmin; max-width: 80vmin; }
    /* At 16:9 the source (2000x1177) is almost the same shape as the frame, so `cover` barely
       crops it and background-position has nothing to move: the WHOLE editor lands in shot,
       including its empty 1280x720 preview canvas, which arrives as a hard black rectangle that
       18px of blur cannot dissolve. So this aspect sets its own background-size to zoom in past
       the canvas, and only then is there overflow for the position to work with.

       The Y is 22% and not centred for a second reason: vertically centred, this zoom lands on
       the BODY of the media library, which is empty, and the backdrop came out an almost flat
       field. 22% brings the panel header, its tabs and the Rendered/Live buttons into shot -
       the part of the editor that actually has structure to blur.

       The transform is smaller here than the 1.25 above because background-size has already
       done the zooming; 1.25 on top of it would crop back toward the centre and undo the 88%.
       It is not 1.0 because a blur still samples past the element's own edge and finds nothing
       there, so a little scale is what keeps that faded band off-canvas. */
    .shot       { background-size: 220% auto; background-position: 88% 22%; transform: scale(1.12); }
  }
</style>
</head>
<body>
  <div class="shot"></div>
  <div class="veil"></div>

  <div class="stack">
    <img class="mark" src="logo.svg" alt="" />
    <div class="is-haunted-text"><strong>Is</strong><em>Haunted</em><span class="dotcom">.com</span></div>
    <div class="product">SideCar</div>
    <div class="rule"></div>
    <div class="tagline">Render video on your own computer, not in a browser tab</div>
  </div>
</body>
</html>
